<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaime Grossoehme</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="wrapper">

    <header>
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/en/4/44/Iowa_State_Cyclones_logo.svg" alt="Iowa State Logo">
            <div class="title">Jaime Grossoehme</div>
        </div>
    </header>

    <nav id="main-nav"></nav>

    <div class="hero">Hero Image Area</div>

    <div class="content-area">
        <div class="main-content">
            <p>Your main content goes here…</p>
        </div>

        <div class="sticky">
            <h3>Sticky Content</h3>
            <ul>
                <li>News items</li>
                <li>Adverts</li>
                <li>Offers</li>
                <li>General site info</li>
                <li>Social Networking icons</li>
            </ul>
        </div>
    </div>

    <footer>
        © <span id="year"></span> Jaime Grossoehme — Contact | Privacy | Webmaster
    </footer>

</div>

<script>
    document.getElementById("year").textContent = new Date().getFullYear();
</script>
<script src="nav.js"></script>

</body>
</html>
